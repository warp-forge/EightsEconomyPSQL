buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url= 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
        classpath 'gradle.plugin.com.github.jengelman.gradle.plugins:shadow:7.0.0'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

archivesBaseName = archives_base_name + "-" + minecraft_version + "-FORGE"

configurations {
    shade
    compileOnly.extendsFrom shade
    compileOnly.extendsFrom shadeSource
}

mixin {
    add sourceSets.main, "EightsEconomyP-refmap.json"
    config "EightsEconomyP.mixins.json"
}

minecraft {
    //accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: "${minecraft_version}"
    runs {
        client {
            workingDirectory project.file('run')
            property 'legacyClassPath', '{minecraft_classpath}'
            arg "-mixin.config=EightsEconomyP.mixins.json"
            args '--mod', 'eights_economy_p', '--all', '--output', file('src/generated/resources/'), '--existing', rootProject.file('src/main/resources/')
            mods {
                eights_economy_p {
                    sources(sourceSets.main, rootProject.sourceSets.main)
                }
            }
        }

        server {
            workingDirectory project.file('run')
            mods {
                eights_economy_p {
                    sources(sourceSets.main, rootProject.sourceSets.main)
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'legacyClassPath', '{minecraft_classpath}'
            args '--mod', 'eights_economy_p', '--all', '--output', file('src/generated/resources/'), '--existing', rootProject.file('src/main/resources/')
            mods {
                eights_economy_p {
                    sources(sourceSets.main, rootProject.sourceSets.main)
                }
            }
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'EightsEconomyP-refmap.json'
}

tasks.processResources.dependsOn(rootProject.tasks.processResources)

repositories {
    mavenLocal()
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    shadow(rootProject)
    shade(rootProject) {
        transitive = false
    }

    jarJar(group: 'com.epherical.octo-economy-api', name: 'OctoEconomyApi-forge', version: '[1.0,)') {
        transitive = false
    }

    implementation fg.deobf("com.epherical.octo-economy-api:OctoEconomyApi-forge:1.1.0-1.18.2")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    shade "com.zaxxer:HikariCP:5.0.1"
    shade "com.mysql:mysql-connector-j:8.0.33"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    source(rootProject.sourceSets.main.allSource)
}

shadowJar {
    archiveClassifier = "all"
    enabled = true
    configurations = [project.configurations.shade]
    relocate 'com.zaxxer.hikari', 'com.epherical.eights.lib.hikari'
    relocate 'com.mysql', 'com.epherical.eights.lib.mysql'
}

artifacts {
    archives shadowJar
    shadow shadowJar
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    "src/main/generated",
                    rootProject.sourceSets.main.resources
            ]
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": "eightsEconomyP",
                "Specification-Vendor": "epherical.com",
                "Specification-Version": "1",
                "Implementation-Title": "${archives_base_name}",
                "Implementation-Version": "${mod_version}",
                "Implementation-Vendor" :"epherical.com",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "eightseconomyp.mixins.json"
        ])
    }
}

reobf {
    shadowJar {}
    jarJar {}
}

jar.finalizedBy('reobfJar')
tasks.jarJar.finalizedBy('reobfJarJar')

// Fix implicit dependency issue
tasks.named('reobfShadowJar') {
    dependsOn tasks.shadowJar
}
